services:
  postgres:
    image: postgres:16
    container_name: robo-advisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: robo
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: robo_advisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robo -d robo_advisor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
