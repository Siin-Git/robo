forward_test:
  timezone: Asia/Seoul
  initial_nav: 100.0
  initial_capital_krw: 100000000
  benchmark_version: CORE_V0.3
  theme_universe_version: THEME_UNIVERSE_V0.1
  risk_model_version: RISK_5Y_LW_FROZEN_V0
  execution_rule_version: NEXT_AVAILABLE_CLOSE_V0
  # Last snapshot trading session used for model outputs. This is a data
  # reference date, NEVER the forward-test inception (inception is set only
  # by the explicit launch command, otherwise NULL).
  model_reference_date: '2026-09-11'
  stale_price_days: 14

  core_rebalance:
    frequency: monthly
    # 목표 비중 대비 상대 편차가 이 값을 넘을 때만 주문을 만든다.
    # 예: 목표 20%, threshold 0.10 -> 18~22% 밖일 때만 조정.
    band:
      type: relative
      threshold: 0.10
      min_absolute: 0.0   # 필요 시 최소 절대 폭(%p, 소수) 병행

  weekly_view:
    max_active_themes: 2
    direction: positive_only
    default_if_no_submission: hold_existing

  view_schedule:
    timezone: Asia/Seoul
    submission_day: friday
    cutoff_time: '18:00'
    effective_rule: next_trading_session

  active_sleeve:
    max_total_weight: 0.15
    max_single_theme_weight: 0.10
    max_themes: 2
    one_theme_default_weight: 0.10
    two_theme_default_weight_each: 0.075

  risk_guardrail:
    max_vol_increase_pp: 1.0

  risk_refresh:
    frequency: monthly

  execution:
    price_rule: next_available_close

  costs:
    trading_cost_bps: 5
    slippage_bps: 0
    fx_cost_bps: 0

  fractional_shares: true

  auth:
    session_ttl_days: 7
    cookie_name: ra_session
    csrf_cookie_name: ra_csrf
    password_min_length: 12
    password_max_length: 128
    max_failed_logins: 5
    lockout_minutes: 15

db_path: data/forward_test.db
frozen_dir: outputs/frozen/CORE_V0.3
phase16_outputs: outputs/latest
snapshot_dir: data/snapshots/SNAPSHOT_20260911_V0
