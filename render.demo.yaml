# Demo only. Keep render.yaml for the original PostgreSQL/live deployment.
# Select feat/capstone-demo-mvp and Blueprint Path: render.demo.yaml in Render.
# Free demo: ephemeral SQLite is recreated by the seed after instance resets.
services:
  - type: web
    name: robo-capstone-api
    runtime: python
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.local.seed_capstone && python -m uvicorn src.api.main:app --host 0.0.0.0 --port 10000 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_PROFILE
        value: local
      - key: CAPSTONE_DEMO
        value: "1"
      - key: CAPSTONE_MARKET_COMPARISON
        value: "1"
      - key: DATABASE_BACKEND
        value: sqlite
      - key: CAPSTONE_DATA_DIR
        value: /tmp/capstone-demo
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: robo-capstone-web
    runtime: node
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: FASTAPI_INTERNAL_URL="https://$FASTAPI_EXTERNAL_HOSTNAME" npx next start --hostname 0.0.0.0 --port "$PORT"
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_APP_PROFILE
        value: local
      - key: NEXT_PUBLIC_CAPSTONE_DEMO
        value: "1"
      - key: FASTAPI_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: robo-capstone-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
