name: backup restore tests

on:
  push:
    paths: ['scripts/postgres_backup*.py', 'tests/backup/**', '.github/workflows/backup*.yml', 'docs/POSTGRES_BACKUP.md']
  pull_request:
    paths: ['scripts/postgres_backup*.py', 'tests/backup/**', '.github/workflows/backup*.yml', 'docs/POSTGRES_BACKUP.md']

permissions:
  contents: read

jobs:
  restore:
    name: actual restore PostgreSQL ${{ matrix.major }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        major: [14, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.major }}
        env:
          POSTGRES_USER: backup_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching client and test runner
        env:
          MAJOR: ${{ matrix.major }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"
          echo "/usr/lib/postgresql/$MAJOR/bin" >> "$GITHUB_PATH"
          pip install pytest
      - name: Actual dumps and isolated restores without operating secrets
        env:
          BACKUP_TEST_ADMIN_URL: postgresql://backup_test:disposable-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres
          BACKUP_REQUIRE_RESTORE_TESTS: '1'
        run: python -m pytest tests/backup -q
