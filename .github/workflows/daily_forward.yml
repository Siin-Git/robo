name: daily-forward

on:
  schedule:
    # 22:30 UTC = 07:30 KST next day (after US close, before KR open).
    # Engine executes only on available prices; never invents future data.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Scheduled-for date YYYY-MM-DD (default: today KST)"
        required: false
      dry_run:
        description: "Plan only, zero writes"
        type: boolean
        default: false

concurrency:
  group: forward-jobs
  cancel-in-progress: false

jobs:
  daily:
    if: ${{ vars.FORWARD_EXECUTOR == 'actions' || inputs.dry_run == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read-only operating target inventory
        if: ${{ inputs.dry_run == true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAPSTONE_DESIGN_DATABASE_URL: ${{ secrets.CAPSTONE_DESIGN_DATABASE_URL }}
        run: python -m scripts.operating_db_inventory --output "$RUNNER_TEMP/operating-db-inventory.json"
      - name: Preserve private target inventory
        if: ${{ always() && inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: operating-db-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/operating-db-inventory.json
          retention-days: 7
      - name: Daily forward run
        env:
          APP_PROFILE: local
          CAPSTONE_DEMO: "1"
          FORWARD_EXECUTOR: actions
          CAPSTONE_DESIGN_DATABASE_URL: ${{ secrets.CAPSTONE_DESIGN_DATABASE_URL }}
          TZ: Asia/Seoul
          # 없으면 get_backend() 기본값 sqlite 가 적용되어 DATABASE_URL 을
          # 무시하고 러너의 빈 SQLite 파일에 기록한다(조용한 실패).
          DATABASE_BACKEND: postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >
          python -m src.forward.run_daily
          ${{ inputs.date && format('--scheduled-for {0}', inputs.date) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
