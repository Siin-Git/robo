name: monthly-rebalance

on:
  schedule:
    # 1st of month 00:30 UTC = 09:30 KST (operates on the closed prior month).
    - cron: "30 0 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (default: prior month)"
        required: false
      dry_run:
        description: "Plan only, zero writes"
        type: boolean
        default: false

concurrency:
  group: forward-jobs
  cancel-in-progress: false

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monthly rebalance
        env:
          APP_PROFILE: live
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >
          python -m src.forward.run_monthly
          ${{ inputs.month && format('--month {0}', inputs.month) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
