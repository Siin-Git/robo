# NOTE: single free instance assumed, so `alembic upgrade head` in the start
# command cannot race with itself. Do not scale to multiple instances without
# moving migrations to a separate deploy job. Additive migrations only.
services:
  - type: web
    name: robo-advisor-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_PROFILE
        value: live
      - key: DATABASE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_PUBLIC_REGISTRATION
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: PYTHON_VERSION
        value: 3.10.11
